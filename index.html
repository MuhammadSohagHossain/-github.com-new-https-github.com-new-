<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyClipVerse</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }

        .logo-placeholder {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #1f1f1f;
            border: 2px dashed #0084ff;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            color: #0084ff;
            font-weight: bold;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #ffffff;
        }

        p {
            font-size: 1.2rem;
            color: #cccccc;
            max-width: 500px;
            line-height: 1.6;
        }

        .badge {
            background-color: #0084ff;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-top: 15px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <!-- লোগো বসানোর জায়গা -->
    <div class="logo-placeholder">
        LOGO
    </div>

    <h1>Welcome to MyClipVerse!</h1>
    <p>আমাদের ওয়েবসাইট ও অ্যাপের কাজ চলছে। খুব শীঘ্রই আসছে একটি নতুন সামাজিক অভিজ্ঞতা!</p>
    
    <div class="badge">Coming Soon</div>

</body>
</html>
